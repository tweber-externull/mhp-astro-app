name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for the release branch and tag (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH (for example v1.2.3)." >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import re
          import subprocess
          import sys

          pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

          def version_tuple(tag):
              match = pattern.fullmatch(tag)
              return tuple(map(int, match.groups())) if match else None

          requested = version_tuple(sys.argv[1])
          existing = [
              (tag, version_tuple(tag))
              for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
              if version_tuple(tag) is not None
          ]

          if existing:
              latest_tag, latest_version = max(existing, key=lambda item: item[1])
              if requested <= latest_version:
                  print(f"{sys.argv[1]} must be greater than the latest existing version {latest_tag}.", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Create release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/$VERSION"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi
          git switch --create "$BRANCH" origin/main
          git push origin "$BRANCH"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --target "release/$VERSION" --title "Release $VERSION" --generate-notes
